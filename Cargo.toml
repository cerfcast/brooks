[package]
name = "brooks-lib"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tree-sitter-mel = { path = "parser" }
bindgen = "0.71.0"
git2 = { version = "0.21.0", features = ["https"] }

[dependencies]
tree-sitter = "0.26.13"
tree-sitter-mel = { path = "parser" }
brooks-macros = { path = "macros" }
pretty_assertions = "1.4.1"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
http = "1.4.2"
tempfile = "3.27.0"
libc = "0.2.189"
reqwest = { version = "0.13.4", optional = true }
tokio = {version = "1.53.1", features=["rt-multi-thread"] }
chrono = { version = "0.4.45", features = ["serde"] }
url = "2.5.8"

[features]
default = ["mi_all_processors"]

# The MI Processors
mi_source = ["dep:reqwest"]
mi_cache = []
mi_ps = []
mi_all_processors = ["mi_source", "mi_cache", "mi_ps"]

domain = []
serializable_logs = []
hmds = ["dep:reqwest"]
nginx = ["hmds", "dep:reqwest"]
caddy = ["hmds", "dep:reqwest"]

[lib]
crate-type = ["cdylib", "rlib"]
