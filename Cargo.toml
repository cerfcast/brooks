[package]
name = "brooks-lib"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tree-sitter-mel = { path = "parser" }
git2 = { version = "0.21.0", features = ["https"] }
bindgen = "0.73.2"

[dependencies]
tree-sitter = "0.27.1"
tree-sitter-mel = { path = "parser" }
brooks-macros = { path = "macros" }
pretty_assertions = "1.4.1"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
http = "1.4.2"
tempfile = "3.27.0"
libc = "0.2.189"
reqwest = { version = "0.13.4", optional = true }
tokio = {version = "1.53.1", features=["rt-multi-thread"], optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
url = "2.5.8"
log = { version = "0.4.34" }

[features]
default = ["processing"]

domain = []
hmds = []
nginx = ["hmds", "processing"]
caddy = ["hmds", "processing"]
express = ["hmds", "processing"]

mel = []
verifying = ["mel"]
processing = ["verifying", "dep:reqwest", "dep:tokio"]

[lib]
crate-type = ["cdylib", "rlib"]
