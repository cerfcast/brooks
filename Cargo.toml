[package]
name = "brooks-cli"
version = "0.1.0"
edition = "2024"

[workspace]
resolver="3"
members=["lib", "macros"]

[dependencies]
brooks-lib = { path = "lib" }
brooks-macros = { path = "macros" }
clap = { version = "4.6.1", features = ["derive"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
insta = "1.48.0"
insta-cmd = "0.6.0"
