on: [push, pull_request]

name: Continuous Integration

jobs:
  grammar-tests:
    name: Grammar Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
      - uses: tree-sitter/setup-action@v2
        with:
          tree-sitter-ref: "master"
      # Because our tree-sitter code is in a subdirectory,
      # and working-directory does not apply to uses, we
      # are forced to specify calls to the CI ourselves.
      # See https://github.com/orgs/community/discussions/25742
      - run: tree-sitter generate
        working-directory: ./parser
      - run: tree-sitter test
        working-directory: ./parser
  library-tests:
    name: Library Tests (Minimal Features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tree-sitter/setup-action@v2
        with:
          tree-sitter-ref: "master"
      # Because our tree-sitter code is in a subdirectory,
      # and working-directory does not apply to uses, we
      # are forced to specify calls to the CI ourselves.
      # See https://github.com/orgs/community/discussions/25742
      - run: tree-sitter generate
        working-directory: ./parser
      - run: cargo build --no-default-features
      - run: cargo test --no-default-features
      - run: cargo test --manifest-path parser/Cargo.toml
  library-tests-mi:
    name: Library Tests (Default Features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tree-sitter/setup-action@v2
        with:
          tree-sitter-ref: "master"
      # Because our tree-sitter code is in a subdirectory,
      # and working-directory does not apply to uses, we
      # are forced to specify calls to the CI ourselves.
      # See https://github.com/orgs/community/discussions/25742
      - run: tree-sitter generate
        working-directory: ./parser
      - run: cargo build
      - run: cargo test
      - run: cargo test --manifest-path parser/Cargo.toml
  library-integration-caddy-build:
    name: Library Integration - Caddy Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tree-sitter/setup-action@v2
        with:
          tree-sitter-ref: "master"
      # Because our tree-sitter code is in a subdirectory,
      # and working-directory does not apply to uses, we
      # are forced to specify calls to the CI ourselves.
      # See https://github.com/orgs/community/discussions/25742
      - run: tree-sitter generate
        working-directory: ./parser
      - run: cargo build -F caddy
  library-integration-nginx-build:
    name: Library Integration - Nginx Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Because our tree-sitter code is in a subdirectory,
      # and working-directory does not apply to uses, we
      # are forced to specify calls to the CI ourselves.
      # See https://github.com/orgs/community/discussions/25742
      - run: git clone https://github.com/nginx/nginx.git integrations/nginx/nginx/
      - run: ./auto/configure
        working-directory: integrations/nginx/nginx/
  library-integration-express-build:
    name: Library Integration - Express Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tree-sitter/setup-action@v2
        with:
          tree-sitter-ref: "master"
      # Because our tree-sitter code is in a subdirectory,
      # and working-directory does not apply to uses, we
      # are forced to specify calls to the CI ourselves.
      # See https://github.com/orgs/community/discussions/25742
      - run: tree-sitter generate
        working-directory: ./parser
      - run: cargo build -F express
  library-format-tests:
    name: Library Format Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt
  generate-docs:
    name: Generate Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: tree-sitter/setup-action@v2
        with:
          tree-sitter-ref: "master"
      # Because our tree-sitter code is in a subdirectory,
      # and working-directory does not apply to uses, we
      # are forced to specify calls to the CI ourselves.
      # See https://github.com/orgs/community/discussions/25742
      - run: tree-sitter generate
        working-directory: ./parser
      - run: cargo build
      - run: cargo doc --no-deps
      - name: Delete lock file
        shell: sh
        run: rm -f target/doc/.lock
      - name: Fix file permissions
        shell: sh
        run: chmod -R a+rX target/doc
      - name: Generate index.html file
        run: |
            echo "<meta http-equiv=refresh content=0;url=brooks_lib/index.html>" > target/doc/index.html
      - name: List file permissions
        shell: sh
        run: ls -latr target/doc
      - name: Upload
        if: env.FORGEJO_ACTIONS != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc
      - name: Deploy Docs
        if: env.FORGEJO_ACTIONS != 'true'
        uses: actions/deploy-pages@v5

